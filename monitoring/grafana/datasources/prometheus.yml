apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Must match prometheus's global scrape_interval: grafana derives
      # $__rate_interval from it; claiming a smaller value yields rate windows
      # with <2 samples, i.e. intermittently empty panels.
      timeInterval: 15s
